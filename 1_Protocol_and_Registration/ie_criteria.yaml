meta:
  name: Title and Abstract Screening
  version: 0.1.0
  description: Can multimodal large language models (M-LLMs), used as automated judges,
    reliably evaluate the safety of AI/ML-based brain MRI reconstruction methods —
    including via causal discovery and counterfactual diffusion-based simulation —
    compared to other safety-evaluation approaches?
framework:
  name: PICOS
review_scope:
  objective: Can multimodal large language models (M-LLMs), used as automated judges,
    reliably evaluate the safety of AI/ML-based brain MRI reconstruction methods —
    including via causal discovery and counterfactual diffusion-based simulation —
    compared to other safety-evaluation approaches?
  framework: PICOS
  inclusion_criteria:
  - Proposes or evaluates a method for assessing the safety, reliability, or fidelity
    of AI/ML-based MRI reconstruction (brain imaging, or general reconstruction methods
    clearly applicable to brain MRI)
  - 'Addresses at least one reconstruction failure mode: hallucinated/fabricated pathology,
    omitted true pathology, geometric or anatomical distortion, or related fidelity
    artifacts'
  - Uses or evaluates LLM-as-judge, multimodal LLM evaluation, causal discovery, counterfactual
    simulation, or diffusion-based simulation as (part of) the evaluation methodology,
    OR is a closely comparable automated/human evaluation baseline
  - Peer-reviewed journal article, conference paper, or reputable preprint (arXiv/medRxiv)
    with a methodological or technical contribution
  - English language
  exclusion_criteria:
  - Purely clinical study with no technical/methodological evaluation contribution
  - Animal-only or phantom-only studies with no relevance to human brain MRI
  - Editorial, letter, or commentary with no original methodology
  - Duplicate or superseded conference version where a fuller journal version exists
  - Non-English full text
  language:
    include:
    - English
  publication_date:
    include_from: any
    include_to: final_search_date
population:
  include:
  - 'AI/ML-based brain MRI reconstruction methods (any architecture: deep-learning
    accelerated, denoising, super-resolution, generative/diffusion-based reconstruction)'
  exclude:
  - Purely clinical study with no technical/methodological evaluation contribution
  - Animal-only or phantom-only studies with no relevance to human brain MRI
  - Editorial, letter, or commentary with no original methodology
  - Duplicate or superseded conference version where a fuller journal version exists
  - Non-English full text
  - Animal or in-vitro studies.
  inclusion_signals: []
  exclusion_signals:
  - animal model
  - case report
  - in vitro
intervention_or_index_system:
  include:
  - Multimodal LLM (M-LLM) used as an automated judge, optionally combined with causal
    discovery and/or counterfactual diffusion-based simulation, to evaluate reconstruction
    safety
  - 'Records addressing: Brain MRI / Neuroimaging; AI/ML Image Reconstruction; Reconstruction
    Safety / Fidelity Evaluation; LLM-as-Judge / Automated Evaluation Methodology.'
  exclude: []
  inclusion_signals:
  - accelerated mri
  - anatomical distortion
  - brain imaging
  - brain magnetic resonance imaging
  - brain mri
  - brain scan
  - causal discovery
  - cerebral mri
  - counterfactual diffusion
  - counterfactual simulation
  - cranial mri
  - deep learning reconstruction
  - denoising
  - diagnostic accuracy loss
  - diffusion model
  - foundation model evaluat
  - generative reconstruction
  - geometric distortion
  - gpt-4 evaluat
  - hallucinat
  - hallucinated pathology
  - image fidelity
  - image reconstruction
  - k-space reconstruction
  - language model as judge
  - large language model
  - llm
  - llm as a judge
  - llm evaluat
  - llm-as-judge
  - m-llm
  - mllm
  - mr reconstruction
  - mri reconstruction
  - multimodal large language model
  - neural network reconstruction
  - neuroimag
  - reconstruction artifact
  - reconstruction error
  - reliability assessment
  - safety evaluation
  - super-resolution mri
  - trustworthiness
  - undersampled reconstruction
  - vision-language model
  exclusion_signals: []
comparator:
  include:
  - Any alternative safety/quality evaluation approach — radiologist ground-truth
    review, pixel-wise metrics (SSIM/PSNR/LPIPS), other automated or LLM-based evaluators,
    or no comparator (proposing a new metric)
outcome:
  include:
  - Ability to detect/quantify reconstruction safety failures — hallucinated pathology,
    geometric/anatomical distortion, and other fidelity or trustworthiness failure
    modes
  exclude: []
  inclusion_signals: []
  exclusion_signals: []
study_and_publication_criteria:
  include:
  - Original peer-reviewed research.
  - Preprints and conference papers with sufficient methodology.
  exclude:
  - Reviews.
  - Editorials.
  - Viewpoints.
  - Protocols.
  - Commentaries.
  inclusion_signals: []
  exclusion_signals:
  - systematic review
  - scoping review
  - narrative review
  - meta-analysis
  - review
  - editorial
  - viewpoint
  - protocol
  - commentary
decision_policy:
  screening_unit: title_and_abstract
  default_bias: conservative
  allow_background_tagging: true
  include_without_comparator: true
  require_validation_evidence: false
  route_uncertain_to_flagged: true
output_policy:
  leave_dedup_unchanged: true
  write_decisions: true
  copy_records_to_decision_folders: false
decision_labels:
  final:
  - include
  - exclude
  - flagged
  - background_only
  exclude_reasons:
  - wrong_population
  - wrong_intervention_or_index
  - wrong_outcome
  - wrong_study_design
  - review_editorial_protocol_commentary
  - out_of_scope
  - non_english
  - outside_date_range
  - insufficient_information
  flag_reasons:
  - population_unclear
  - intervention_unclear
  - outcome_unclear
  - study_design_unclear
  - insufficient_information
  - needs_human_review
  background_reasons:
  - review_for_background
  - citation_tracking_only
extraction_targets:
  required_fields:
  - pmid
  - doi
  - title
  - journal
  - year
  - authors
  - publication_types
  - abstract
  - keywords
  - mesh_terms
  - pubmed_url
  decision_fields:
  - decision
  - confidence
  - include_reason
  - exclude_reason
  - flag_reason
  - background_reason
  - population_assessment
  - intervention_assessment
  - outcome_assessment
  - study_design_assessment
  - validation_assessment
  - evidence_spans
  - needs_human_review
